name: Phantom CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    name: Chrome logic (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (fuzzy, filter engine, policy)
        run: npm test
      - name: Boot smoke test
        run: |
          npm install --no-save jsdom@25
          node tools/dev-server.js &
          sleep 2
          node tests/smoke.mjs

  core-tests:
    name: phantom-core (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests
        run: cargo test -p phantom-core
      - name: Clippy (deny warnings)
        run: cargo clippy -p phantom-core -- -D warnings

  build-linux:
    name: Build (Linux / WebKitGTK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WebKitGTK + GTK dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev pkg-config libssl-dev
      - name: Build shell
        run: cargo build --release -p phantom-app
      - uses: actions/upload-artifact@v4
        with:
          name: phantom-linux
          Path: |
            target/release/phantom
            ui/

  build-macos:
    name: Build DMG (macOS universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build universal .dmg (Apple Silicon + Intel)
        run: ./packaging/macos/make-dmg.sh universal
      - name: Verify DMG
        run: |
          ls -lh dist/*.dmg
          hdiutil verify dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: phantom-macos-dmg
          Path: dist/*.dmg
          if-no-files-found: error

  release:
    name: GitHub Release (DMG download)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-linux, core-tests, ui-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phantom-macos-dmg
          Path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.dmg
          body: |
            ## Phantom for mac - installation
            1. Download the `.dmg` below and open it.
            2. Drag **Phantom** into **Applications**.
            3. First launch (unsigned build): right-click Phantom in Applications -> **Open** -> **Open**.

            Universal binary: runs natively on Apple Silicon and Intel, macOS 12.0+.
            Zero telemetry - see PRIVACY.md in the repository.
