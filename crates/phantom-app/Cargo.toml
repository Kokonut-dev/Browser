[package]
name = "phantom-app"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Phantom browser shell: tao windows + system WebKit (WebKitGTK / WKWebView) via wry."

[[bin]]
name = "phantom"
Path = "src/main.rs"

[dependencies]
phantom-core = { Path = "../phantom-core" }
tao = "0.29"
wry = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
# WebKitGTK is linked by wry; nothing extra needed here.
